version: '3'

# Local alternative to the GitHub workflow .github/workflows/build-zip.yml and to build/build.xml.
#
# All steps of the release run via bin/build-release.sh, which is also used by the GitHub workflow
# and by Ant. So all of them create a zip with the same content.
#
# "task release -- 4.0.0" runs the checks and creates releases/easy-language_4.0.0.zip
# "task build_zip -- 4.0.0" creates only the zip (after "task prepare").
#
# Not possible here (only in the GitHub workflow): the Plugin Check (PCP), the SBOM and the GitHub
# release itself. The smoke test in WordPress Playground runs with SMOKE=true (needs Node 24).
#
# Needs: bash, composer, npm, rsync and zip.
#
# Options as environment variables:
#   SKIP_CHECKS=true  skip PHPStan, PHPCS and the PHP compatibility check
#   SMOKE=true        run the smoke test in WordPress Playground

vars:
  RELEASE_SLUG: easy-language
  VERSION: '{{.CLI_ARGS}}'
  RELEASE_ZIP: 'releases/{{.RELEASE_SLUG}}_{{.CLI_ARGS}}.zip'

env:
  RELEASE_SLUG: '{{.RELEASE_SLUG}}'

tasks:
  default:
    - task: prepare

  # prepare the checkout: PHP packages (with Mozart), blocks, sidebar, page builder fields and react-dialog.
  prepare:
    cmds:
      - bash bin/build-release.sh init

  # code checks (same as in .github/workflows/testing.yml).
  check:
    cmds:
      - composer validate --strict --no-check-publish --no-check-version
      - vendor/bin/phpstan analyse --no-progress
      - vendor/bin/phpcs .
      - vendor/bin/phpcs -p app --standard=PHPCompatibilityWP --runtime-set testVersion 8.2- --ignore=*/Dependencies/*

  # creates releases/easy-language_<version>.zip, e.g. with "task build_zip -- 4.0.0".
  # "task prepare" must have been run before.
  build_zip:
    preconditions:
      - sh: echo '{{.VERSION}}' | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
        msg: "Use a version number like 4.0.0 or 4.0.0-beta.1, e.g.: task build_zip -- 4.0.0"
    cmds:
      # get the dev packages back at the end, also if one of the following steps fails.
      - defer: bash bin/build-release.sh restore
      - bash bin/build-release.sh prepare
      - bash bin/build-release.sh collect '{{.VERSION}}'
      - bash bin/build-release.sh zip '{{.RELEASE_ZIP}}'

  # smoke test the zip in WordPress Playground (same blueprint as in the workflow).
  smoke_test:
    cmds:
      - bash bin/build-release.sh smoke '{{.RELEASE_ZIP}}'

  # runs the checks and creates the release zip, e.g. with "task release -- 4.0.0".
  release:
    preconditions:
      - sh: echo '{{.VERSION}}' | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
        msg: "Use a version number like 4.0.0 or 4.0.0-beta.1, e.g.: task release -- 4.0.0"
    cmds:
      - task: prepare
      - task: check
        if: '[ "$SKIP_CHECKS" != "true" ]'
      - task: build_zip
      - task: smoke_test
        if: '[ "$SMOKE" = "true" ]'
      - echo 'Release file generated in {{.RELEASE_ZIP}}'
